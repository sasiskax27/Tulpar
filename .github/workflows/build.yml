name: build

# Проверяем, что Tulpar собирается на всех трёх ОС, при каждом пуше и пулл-реквесте.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные пакеты для Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости интерфейса
        run: npm install

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка интерфейса
        run: npm run build

      - name: Сборка ядра
        run: cargo build --manifest-path src-tauri/Cargo.toml
